# Config de Netlify para el frontend de resq.
# Deploy: New site -> Import from Git -> elegir repo de tu cuenta (MatteoWiQ/resQ-frontend)
# y Netlify toma esta config automaticamente.
# El proxy evita tocar CORS en el backend: el navegador solo ve mismo-origen.

[build]
  command = "npm ci && npm run build"

# Backend por proxy: todo /api/* va a Render sin cambiar una linea del front.
[[redirects]]
  from = "/api/*"
  to = "https://resq-backend-ui24.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback: rutas de Angular (ej: /login) sirven index.html.
# Sin force=true para que los assets (.js/.css) existentes se sirvan como archivos.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
