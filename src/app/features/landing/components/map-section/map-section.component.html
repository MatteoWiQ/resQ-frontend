<section class="map-panel section-block" id="mapa">
  <div class="section-heading split">
    <div>
      <span class="eyebrow">Mapa de casos</span>
      <h2>Casos activos por zona</h2>
    </div>
    <button class="secondary-btn small" type="button">Ver todos</button>
  </div>

  <div class="map-layout">
    <div class="map-art" aria-label="Mapa de casos">
      <div class="map-grid"></div>
      <span class="pin pin-red">📍</span>
      <span class="pin pin-gold">📍</span>
      <span class="pin pin-green">📍</span>
      <span class="pin pin-red">📍</span>
      <span class="pin pin-gold">📍</span>
    </div>

    <aside class="case-list">
      <div class="case-item active">
        <div>
          <span class="label danger">Urgente</span>
          <strong>Perro en carretera</strong>
        </div>
        <small>San Martín</small>
      </div>
      <div class="case-item">
        <div>
          <span class="label warning">Activo</span>
          <strong>Gato herido</strong>
        </div>
        <small>Centro</small>
      </div>
      <div class="case-item">
        <div>
          <span class="label success">Resuelto</span>
          <strong>Cachorro perdido</strong>
        </div>
        <small>Villa Sur</small>
      </div>
    </aside>
  </div>
</section>
