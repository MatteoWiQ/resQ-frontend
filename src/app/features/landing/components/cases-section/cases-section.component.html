<section class="cases section-block" id="casos">
  <div class="section-heading split">
    <div>
      <span class="eyebrow">Casos recientes</span>
      <h2>Necesidades reales</h2>
    </div>
    <button class="secondary-btn small" type="button">Filtrar</button>
  </div>

  <div class="case-grid">
    <article class="animal-card">
      <div class="card-image image-one"></div>
      <div class="card-body">
        <div class="card-topline">
          <span class="label danger">Rescate</span>
          <span class="time">2h</span>
        </div>
        <h3>Luna</h3>
        <p>Necesita transporte para llegar al refugio.</p>
      </div>
    </article>

    <article class="animal-card">
      <div class="card-image image-two"></div>
      <div class="card-body">
        <div class="card-topline">
          <span class="label success">Hogar</span>
          <span class="time">4h</span>
        </div>
        <h3>Milo</h3>
        <p>Busca hogar temporal con atención veterinaria.</p>
      </div>
    </article>

    <article class="animal-card">
      <div class="card-image image-three"></div>
      <div class="card-body">
        <div class="card-topline">
          <span class="label info">Transporte</span>
          <span class="time">1d</span>
        </div>
        <h3>Tomy</h3>
        <p>Requiere traslado a clínica para revisión urgente.</p>
      </div>
    </article>
  </div>
</section>
