<main class="login-page">
  <app-back-button/>

  <section class="login-card">
    <div class="brand">
      <div class="brand-mark">{{ 'shared.brand.marca' | translate }}</div>
      <span class="brand-name">{{ 'shared.brand.nombre' | translate }}</span>
    </div>

    @if (message()) {
      <p class="message">{{ message() }}</p>
    }

    <h1>{{ 'auth.login.titulo' | translate }}</h1>


    <form (ngSubmit)="onLogin()">
      <label for="email">{{ 'auth.login.correo' | translate }}</label>
      <input
        id="email"
        type="email"
        name="email"
        [(ngModel)]="credentials.email"
        [placeholder]="'auth.login.correoPlaceholder' | translate"
        required
        autocomplete="email"
      />

      <label for="password">{{ 'auth.login.password' | translate }}</label>
      <input
        id="password"
        type="password"
        name="password"
        [(ngModel)]="credentials.password"
        [placeholder]="'auth.login.passwordPlaceholder' | translate"
        required
        autocomplete="current-password"
      />

      <button class="primary-btn submit" type="submit">{{ 'auth.login.boton' | translate }}</button>
    </form>

    <div class="register-prompt">
      <span>{{ 'auth.login.noCuenta' | translate }}</span>
      <a class="secondary-btn register-link" routerLink="/register">{{ 'auth.login.registrate' | translate }}</a>
    </div>
  </section>
</main>
